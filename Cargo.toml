[package]
name = "axonos-stack"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "The reference session: four AxonOS organs wired together — acquisition, conditioning, privacy boundary and posture — running deterministically from a seed, with byte-exact transcripts diffed in CI."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/AxonOS-org/axonos-stack"
publish = false

[[bin]]
name = "session"
path = "src/main.rs"

[dependencies]
axonos-hal = { git = "https://github.com/AxonOS-org/axonos-hal", tag = "v0.2.0", features = ["sim"] }
axonos-vault = { git = "https://github.com/AxonOS-org/axonos-vault", tag = "v0.2.0" }
axonos-supervisor = { git = "https://github.com/AxonOS-org/axonos-supervisor", tag = "v0.1.1" }
# The fourth organ. Until 0.3.0 this session went from the converter straight
# to the vault, skipping every stage that makes a sample into evidence — which
# meant the "reference session" referenced about half the system.
axonos-pipeline-core = { git = "https://github.com/AxonOS-org/axonos-signal-pipeline", tag = "v0.9.1" }
